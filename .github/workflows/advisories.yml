name: Advisories

# The dependency check of ci.yml runs only on a push or a pull request. A
# new RustSec advisory against a locked dependency appears without either,
# so this workflow checks the advisories every day (testing ADR 0005).
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check
          arguments: --all-features
          command-arguments: advisories
