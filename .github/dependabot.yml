version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL fails when its init and analyze steps run different versions.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: docker
    directories:
      - /tests/interop/postfix
      - /tests/interop/sendmail
      - /tests/interop/runner
      - /tests/interop/dns
    schedule:
      interval: weekly
