# DNS for the interoperability stack. Unbound answers for the names in
# void.invalid and their addresses, and answers NXDOMAIN at once for every
# other name: the stack has no route out, so no query is sent anywhere.
# The addresses are the fixed ones in tests/interop/compose.yaml.
server:
    interface: 0.0.0.0
    port: 53
    do-ip6: no
    access-control: 10.231.0.0/24 allow
    access-control: 127.0.0.0/8 allow
    chroot: ""
    username: "unbound"
    directory: "/etc/unbound"
    # Log to stderr, which is the container's log, and log every query, so
    # that a failing test shows what the MTAs looked up.
    use-syslog: no
    logfile: ""
    verbosity: 1
    log-queries: yes

    # No recursion: a name without local data gets NXDOMAIN.
    local-zone: "." static

    local-data: "void.invalid. IN MX 10 runner.void.invalid."
    local-data: "runner.void.invalid. IN A 10.231.0.10"
    local-data: "postfix.void.invalid. IN A 10.231.0.25"
    local-data: "sendmail.void.invalid. IN A 10.231.0.26"
    local-data: "sendmail-short.void.invalid. IN A 10.231.0.27"
    local-data: "dns.void.invalid. IN A 10.231.0.53"

    local-data-ptr: "10.231.0.10 runner.void.invalid"
    local-data-ptr: "10.231.0.25 postfix.void.invalid"
    local-data-ptr: "10.231.0.26 sendmail.void.invalid"
    local-data-ptr: "10.231.0.27 sendmail-short.void.invalid"
    local-data-ptr: "10.231.0.53 dns.void.invalid"

remote-control:
    control-enable: no
