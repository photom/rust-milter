[package]
name = "rust-milter-docs"
version = "0.0.0"
description = "Compiles the Rust examples in docs/tutorials and docs/how-to as doctests"
publish = false
# The library's version, as for the library's own tests: the test support
# code in tests/support expects it. The tests build with the pinned
# toolchain.
rust-version = "1.85"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["check"]
# Compiles the examples. The CI pass without default features turns it
# off, so that rust-milter is built there without its features.
check = ["rust-milter/otel", "rust-milter/serde"]

[dependencies]
# The test support code of tests/support, which the examples of "Write a
# network test" use.
bytes = "1"
rust-milter = { path = "../.." }
socket2 = "0.6"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[dev-dependencies]
# What the examples use.
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "metrics", "trace"] }
opentelemetry_sdk = "0.33"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "rt-multi-thread"] }
toml = "1.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
