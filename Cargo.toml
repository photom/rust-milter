[workspace]
members = [".", "tests/interop"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/photom/rust-milter"

[package]
name = "rust-milter"
version = "0.1.0"
description = "An asynchronous Milter protocol server library for Sendmail and Postfix"
rust-version = "1.85"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["milter", "sendmail", "postfix", "smtp", "mail"]
categories = ["email", "network-programming", "asynchronous"]

[lints]
workspace = true

[dependencies]
bytes = "1"
thiserror = "2"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
