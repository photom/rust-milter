[workspace]
members = [".", "tests/docs", "tests/interop", "tests/style"]
default-members = [".", "tests/docs", "tests/style"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/photom/rust-milter"

[package]
name = "rust-milter"
version = "0.1.0"
description = "An asynchronous Milter protocol server library for Sendmail and Postfix"
rust-version = "1.85"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["milter", "sendmail", "postfix", "smtp", "mail"]
categories = ["email", "network-programming", "asynchronous"]

[lints]
workspace = true

[dependencies]
bytes = "1"
opentelemetry = { version = "0.33", default-features = false, features = ["metrics"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["testing"] }
proptest = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
toml = "1.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[features]
otel = ["dep:opentelemetry"]
serde = ["dep:serde"]
# Hidden hooks for rust-milter's own tests; not covered by semver.
test-support = []

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# These lints suggest a method that takes a closure, such as map, filter,
# find, retain, or entry().or_insert_with(). rust-milter writes the match
# or the loop instead (ADR 0008).
manual_filter = "allow"
manual_filter_map = "allow"
manual_find = "allow"
manual_find_map = "allow"
manual_map = "allow"
manual_retain = "allow"
map_entry = "allow"
# The methods of clippy.toml are reported only by the style check's Clippy
# run, which skips the calls a derive macro generates (ADR 0011).
disallowed_methods = "allow"
